<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MeghPrahari Replay</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
<style>
  :root{--bg:#f4f8fc;--ink:#0b1f3a;--mut:#5b6b82;--card:#fff;--line:#d5e2f0;--warn:#b45309;
        --strong:#c2410c;--moderate:#ca8a04;--weak:#15803d;--unknown:#6b7280;--accent:#1d4ed8}
  @media (prefers-color-scheme:dark){:root{--bg:#0b1f3a;--ink:#eef4fb;--mut:#9fb3cc;--card:#12294a;--line:#1f3b63;
        --warn:#fbbf24;--strong:#fb923c;--moderate:#facc15;--weak:#4ade80;--unknown:#9ca3af;--accent:#93c5fd}}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink);display:grid;
       grid-template-rows:auto auto 1fr;height:100vh}
  header{display:flex;gap:.6rem;align-items:baseline;padding:.5rem 1rem;flex-wrap:wrap}
  header h1{font-size:1.05rem;margin:0}
  .badge{font-size:.8rem;font-weight:600;color:var(--warn)}
  #status{font-size:.8rem;color:var(--mut)}
  .bar{display:flex;gap:.6rem;align-items:center;padding:.3rem 1rem .5rem;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .bar input[type=range]{flex:1 1 220px;min-width:160px}
  #clock{font-variant-numeric:tabular-nums;min-width:15rem}
  main{display:grid;grid-template-columns:1fr 380px;min-height:0}
  #map{min-height:300px}
  aside{overflow:auto;padding:.5rem 1rem;border-left:1px solid var(--line)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.6rem .8rem;margin:.5rem 0}
  .card h3{margin:.1rem 0 .3rem;font-size:1rem}
  .mut{color:var(--mut);font-size:.85rem}
  .ing{display:grid;grid-template-columns:6.2rem 1fr;gap:.2rem .5rem;margin:.3rem 0}
  .chip{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;border-radius:4px;padding:.05rem .35rem;
        color:#fff;height:fit-content}
  .strong{background:var(--strong)}.moderate{background:var(--moderate)}.weak{background:var(--weak)}.unknown{background:var(--unknown)}
  .probs{display:grid;grid-template-columns:auto repeat(3,1fr);gap:.2rem .4rem;font-variant-numeric:tabular-nums;font-size:.85rem}
  .legend{display:flex;align-items:center;gap:.3rem;font-size:.75rem;color:var(--mut)}
  .legend span{width:16px;height:10px;display:inline-block;border-radius:2px}
  button,select{font:inherit;padding:.25rem .6rem}
  .event{border-left:3px solid var(--strong);padding-left:.5rem;margin:.4rem 0}
  @media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:55vh auto}aside{border-left:0}}
</style>
</head>
<body>
<header>
  <h1>MeghPrahari · event replay</h1>
  <span class="badge">SHADOW MODE · exercise / hindcast only, not an official warning</span>
  <span id="status">loading…</span>
</header>
<div class="bar">
  <button id="play" aria-label="Play">▶ Play</button>
  <input id="slider" type="range" min="0" max="0" value="0" aria-label="Replay time">
  <span id="clock"></span>
  <label>Show <select id="target" aria-label="Hazard and lead window"></select></label>
  <label><input id="showEvents" type="checkbox" checked> what actually happened</label>
  <span class="legend" aria-label="Rain rate legend">rain mm/h
    <span style="background:#c6dbef"></span>1 <span style="background:#6baed6"></span>5
    <span style="background:#2171b5"></span>10 <span style="background:#fd8d3c"></span>20 <span style="background:#bd0026"></span>40</span>
</div>
<main>
  <div id="map"></div>
  <aside>
    <div class="card" id="modelCard"></div>
    <div class="card" id="villageCard"><h3>Select a village</h3><div class="mut">Click a village on the map to see why it is at risk, what is exposed and how much time there is to act.</div></div>
    <div class="card"><h3>What actually happened</h3><div id="events" class="mut"></div></div>
  </aside>
</main>
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script>
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const event = new URLSearchParams(location.search).get('event') || 'mandi_2025_06_30';
const RAMP = [[1, [198, 219, 239]], [5, [107, 174, 214]], [10, [33, 113, 181]], [20, [253, 141, 60]], [40, [189, 0, 38]]];
let B, map, k = 0, timer = null, selected = null, shownFrame = 0;

function rainColour(v) {                                // v in mm/h; below 0.5 transparent
  if (!(v >= 1)) return null;
  let c = RAMP[0][1];
  for (const [thr, col] of RAMP) if (v >= thr) c = col;
  return c;
}
function rainImage(i) {
  const W = B.grid.lon.length, H = B.grid.lat.length, vals = B.rain.values[i];
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d'), img = ctx.createImageData(W, H);
  const northFirst = B.grid.lat[0] > B.grid.lat[H - 1];
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const v = vals[r * W + c], col = v < 0 ? null : rainColour(v / B.meta.rain_scale);
    const rr = northFirst ? r : H - 1 - r, o = (rr * W + c) * 4;
    if (col) { img.data.set(col, o); img.data[o + 3] = v / B.meta.rain_scale < 5 ? 90 : 190; }
  }
  ctx.putImageData(img, 0, 0);
  return cv.toDataURL();
}
function corners() {
  const la = B.grid.lat, lo = B.grid.lon, dy = Math.abs(la[1] - la[0]) / 2, dx = Math.abs(lo[1] - lo[0]) / 2;
  const n = Math.max(...la) + dy, s = Math.min(...la) - dy, w = Math.min(...lo) - dx, e = Math.max(...lo) + dx;
  return [[w, n], [e, n], [e, s], [w, s]];
}
const anchorIndex = () => B.anchors.indexOf(B.rain.times[k]);
function fmt(iso) {
  const d = new Date(iso), ist = new Date(d.getTime() + 330 * 60000);
  const p = x => String(x).padStart(2, '0');
  return `${d.toISOString().slice(0, 16).replace('T', ' ')} UTC · ${p(ist.getUTCDate())}/${p(ist.getUTCMonth() + 1)} ${p(ist.getUTCHours())}:${p(ist.getUTCMinutes())} IST`;
}
function villageColour(v) {
  const a = anchorIndex(), t = $('target').value;
  if (!B.meta.models.length || a < 0) return '#64748b';
  const p = (v.probs[t] || [])[a];
  return p == null ? '#64748b' : p >= 0.6 ? '#d7301f' : p >= 0.3 ? '#fd8d3c' : p >= 0.1 ? '#fde725' : '#5ec962';
}
function render() {
  $('slider').value = k;
  $('clock').textContent = fmt(B.rain.times[k]);
  if (k !== shownFrame) { map.getSource('rain').updateImage({url: rainImage(k), coordinates: corners()}); shownFrame = k; }
  map.getSource('villages').setData({type: 'FeatureCollection', features: B.villages.map((v, i) => ({type: 'Feature',
    geometry: {type: 'Point', coordinates: [v.lon, v.lat]}, properties: {i, name: v.name, colour: villageColour(v)}}))});
  if (selected != null) showVillage(selected);
}
function showVillage(i) {
  selected = i;
  const v = B.villages[i], a = anchorIndex(), box = $('villageCard');
  box.replaceChildren(el('h3', null, v.name));
  const ex = v.exposure || {};
  box.append(el('div', 'mut', `Catchment ${v.link} · water reaches the outlet in ~${Math.round(v.tc_min)} min · ` +
    `${ex.schools ?? 0} school(s), ${ex.health ?? 0} health facility(ies), ${Number(ex.road_km ?? 0).toFixed(1)} km main road (OSM)`));
  if (B.meta.models.length && a >= 0) {
    const g = el('div', 'probs');
    g.append(el('b', null, ''), el('b', null, '0–2 h'), el('b', null, '2–4 h'), el('b', null, '4–6 h'));
    for (const [h, name] of [['ts', 'Thunderstorm'], ['cb', 'Extreme burst'], ['ff', 'Flash flood']]) {
      g.append(el('span', null, name));
      for (const b of ['0_2', '2_4', '4_6']) { const p = (v.probs[`${h}_${b}`] || [])[a]; g.append(el('span', null, p == null ? '–' : `${Math.round(p * 100)}%`)); }
    }
    box.append(el('h4', null, 'Model probability'), g);
  }
  const card = a >= 0 ? v.cards[a] : null;
  box.append(el('h4', null, 'Why? (the ingredients right now)'));
  if (!card) { box.append(el('div', 'mut', 'Not enough data at this time step.')); return; }
  for (const [name, status, text] of card.i) {
    const row = el('div', 'ing');
    const left = el('div'); left.append(el('span', `chip ${status}`, status));
    left.append(el('div', 'mut', name.replace('_', ' ')));
    row.append(left, el('div', null, text)); box.append(row);
  }
  box.append(el('div', 'mut', card.s + ' These describe the inputs; they are not a causal attribution of the model.'));
}
function showEvents() {
  const box = $('events'); box.replaceChildren();
  if (!B.ledger.length) { box.textContent = 'No event-ledger places with coordinates for this event.'; return; }
  for (const e of B.ledger) {
    const d = el('div', 'event');
    d.append(el('b', null, `${e.place} · ${e.hazard || 'other'}`), el('div', null, e.what));
    if (e.toll) d.append(el('div', 'mut', e.toll));
    d.append(el('div', 'mut', `Source: ${e.source}`)); box.append(d);
  }
}
function modelBanner() {
  const m = $('modelCard'); m.replaceChildren(el('h3', null, B.meta.name));
  m.append(el('div', null, `Rain: ${B.meta.rain_source.toUpperCase()} (${B.meta.rain_units}), hourly`));
  m.append(el('div', B.meta.models.length ? null : 'badge', `Model: ${B.meta.model_status}`));
  for (const n of B.meta.model_notes || []) m.append(el('div', 'mut', n));
}
async function start() {
  const r = await fetch(`replay/${encodeURIComponent(event)}.json`);
  if (!r.ok) { $('status').textContent = `No replay bundle for "${event}". Run tools/export_replay.py --event ${event}`; return; }
  B = await r.json();
  $('status').textContent = `${B.rain.times.length} hourly frames · ${B.villages.length} villages · generated ${B.meta.generated}`;
  for (const h of ['ts', 'cb', 'ff']) for (const b of ['0_2', '2_4', '4_6']) $('target').add(new Option(`${h} ${b.replace('_', '–')} h`, `${h}_${b}`));
  $('target').disabled = !B.meta.models.length;
  $('slider').max = B.rain.times.length - 1;
  modelBanner(); showEvents();
  const bb = B.meta.box;
  map = new maplibregl.Map({container: 'map', bounds: [[bb.lon_min - 0.15, bb.lat_min - 0.15], [bb.lon_max + 0.15, bb.lat_max + 0.15]],
    style: {version: 8, sources: {osm: {type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256,
      attribution: '© OpenStreetMap contributors · rain: NCMRWF MERA · weather: ERA5 (Copernicus)'}},
      layers: [{id: 'osm', type: 'raster', source: 'osm'}]}});
  map.on('load', () => {
    map.addSource('rain', {type: 'image', url: rainImage(0), coordinates: corners()});
    map.addLayer({id: 'rain', type: 'raster', source: 'rain', paint: {'raster-resampling': 'nearest', 'raster-opacity': 0.8}});
    map.addSource('box', {type: 'geojson', data: {type: 'Feature', geometry: {type: 'LineString', coordinates:
      [[bb.lon_min, bb.lat_min], [bb.lon_max, bb.lat_min], [bb.lon_max, bb.lat_max], [bb.lon_min, bb.lat_max], [bb.lon_min, bb.lat_min]]}}});
    map.addLayer({id: 'box', type: 'line', source: 'box', paint: {'line-color': '#1d4ed8', 'line-width': 2, 'line-dasharray': [2, 2]}});
    map.addSource('events', {type: 'geojson', data: {type: 'FeatureCollection', features: B.ledger.map(e => ({type: 'Feature',
      geometry: {type: 'Point', coordinates: [e.lon, e.lat]}, properties: {place: e.place}}))}});
    map.addLayer({id: 'events', type: 'circle', source: 'events', paint: {'circle-radius': 9, 'circle-color': 'rgba(0,0,0,0)',
      'circle-stroke-color': '#dc2626', 'circle-stroke-width': 3}});
    map.addSource('villages', {type: 'geojson', data: {type: 'FeatureCollection', features: []}});
    map.addLayer({id: 'villages', type: 'circle', source: 'villages', paint: {'circle-radius': 6, 'circle-color': ['get', 'colour'],
      'circle-stroke-color': '#fff', 'circle-stroke-width': 1.5}});
    map.on('click', 'villages', e => showVillage(e.features[0].properties.i));
    map.on('mouseenter', 'villages', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'villages', () => map.getCanvas().style.cursor = '');
    render();
  });
}
$('slider').oninput = e => { k = +e.target.value; render(); };
$('target').onchange = () => render();
$('showEvents').onchange = e => map && map.setLayoutProperty('events', 'visibility', e.target.checked ? 'visible' : 'none');
$('play').onclick = () => {
  if (timer) { clearInterval(timer); timer = null; $('play').textContent = '▶ Play'; return; }
  $('play').textContent = '❚❚ Pause';
  timer = setInterval(() => { k = (k + 1) % B.rain.times.length; render(); }, 700);
};
start();
</script>
</body>
</html>
