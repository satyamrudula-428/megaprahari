# docker compose up -d --build     (create .env from .env.example first; edit settings/settings.yaml)
x-app: &app
  build: .
  image: meghprahari:0.1
  user: "${MP_UID:-10001}:${MP_GID:-10001}"
  environment:
    MP_DATABASE_URL: postgresql://mp:${POSTGRES_PASSWORD}@db:5432/meghprahari
    MP_JWT_SECRET: ${MP_JWT_SECRET:?set MP_JWT_SECRET (>=32 chars) in .env}
    MP_CONFIG: /app/settings/settings.yaml
  volumes:
    - ./settings:/app/settings:ro
    - ./data:/data
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: meghprahari
      POSTGRES_USER: mp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (URL-safe characters only)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mp -d meghprahari"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]          # put a TLS reverse proxy (Caddy/nginx) in front; never expose plain HTTP
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      retries: 5
  worker:
    <<: *app
    command: ["python", "-m", "meghprahari.worker"]

volumes:
  pgdata:
